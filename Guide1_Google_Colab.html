<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Getting Started with Google Colab — Rutgers SC&amp;I Bootcamp</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --ink:#16223B; --ink2:#212E50; --scarlet:#CC0033; --steel:#5B6B8C;
    --steel-lt:#93A2C4; --cloud:#EDF1F9; --code-bg:#1B2845; --code-txt:#E7EBF3;
    --card-bd:#D4DCEC; --body:#46506A; --ink-txt:#1E2A45; --paper:#FFFFFF;
    --head:'Fraunces', Georgia, serif;
    --mono:'JetBrains Mono','Consolas',monospace;
    --sans:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:#0c1426;font-family:var(--sans);color:var(--ink-txt);overflow:hidden;}
  #root{width:100%;height:100%;}
  .deck{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 120% at 50% -10%, #1a2742 0%, #0c1426 60%, #070d1a 100%);}
  .stage{width:1280px;height:720px;position:relative;overflow:hidden;border-radius:10px;
    background:var(--paper);box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.04);}
  .slide{position:absolute;inset:0;padding:62px 70px;}
  .slide.dark{background:var(--ink);color:#fff;}
  .kicker{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--scarlet);
    letter-spacing:.26em;text-transform:uppercase;}
  .s-title{font-family:var(--head);font-weight:600;color:var(--ink-txt);font-size:40px;
    line-height:1.08;margin-top:14px;letter-spacing:-.01em;}
  .slide.dark .s-title{color:#fff;}
  .code{background:var(--code-bg);border-radius:13px;padding:42px 26px 24px;position:relative;
    box-shadow:0 14px 34px rgba(0,0,0,.30);font-family:var(--mono);}
  .dots{position:absolute;top:16px;left:22px;display:flex;gap:8px;}
  .dots i{width:11px;height:11px;border-radius:50%;display:block;}
  .code pre{font-family:var(--mono);font-size:15px;line-height:1.55;color:var(--code-txt);white-space:pre-wrap;}
  .code .cm{color:var(--steel-lt);}
  .card{background:var(--cloud);border:1px solid var(--card-bd);border-radius:12px;
    box-shadow:0 10px 26px rgba(20,30,55,.10);position:relative;overflow:hidden;}
  .card .edge{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--scarlet);}
  .card .top{position:absolute;left:0;right:0;top:0;height:5px;background:var(--scarlet);}
  .num-chip{width:58px;height:58px;border-radius:50%;background:var(--scarlet);color:#fff;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;font-size:24px;
    box-shadow:0 8px 20px rgba(204,0,51,.32);}
  .footnote{font-style:italic;color:var(--steel);font-size:16px;}
  ul.blist{list-style:none;display:flex;flex-direction:column;gap:16px;}
  ul.blist li{position:relative;padding-left:26px;font-size:18px;line-height:1.45;color:var(--ink-txt);}
  ul.blist li::before{content:"";position:absolute;left:2px;top:9px;width:9px;height:9px;border-radius:2px;
    background:var(--scarlet);transform:rotate(45deg);}
  .slide.dark ul.blist li{color:#e7ebf3;}
  .tip{background:var(--cloud);border:1px solid var(--card-bd);border-radius:12px;padding:22px 26px;position:relative;
    box-shadow:0 10px 26px rgba(20,30,55,.10);overflow:hidden;}
  .tip .edge{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--scarlet);}
  .tip h4{font-family:var(--head);font-weight:600;font-size:19px;color:var(--ink-txt);}
  .tip p{font-size:15px;color:var(--body);margin-top:8px;line-height:1.4;}
  .divider .mod-label{font-family:var(--mono);font-size:15px;letter-spacing:.32em;color:var(--steel-lt);text-transform:uppercase;font-weight:700;}
  .divider .big-num{font-family:var(--head);font-weight:700;color:var(--scarlet);font-size:200px;line-height:.8;}
  .divider .d-title{font-family:var(--head);font-weight:700;color:#fff;font-size:50px;}
  .divider .d-sub{color:var(--steel-lt);font-size:21px;margin-top:10px;}
  .ic-ring{width:118px;height:118px;border-radius:50%;background:var(--ink2);border:2px solid var(--scarlet);
    display:flex;align-items:center;justify-content:center;}
  /* chrome */
  .chrome{position:fixed;left:0;right:0;bottom:0;height:54px;display:flex;align-items:center;justify-content:center;gap:18px;z-index:50;}
  .nav-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#cdd6ea;width:38px;height:38px;
    border-radius:9px;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;transition:.18s;}
  .nav-btn:hover{background:var(--scarlet);border-color:var(--scarlet);color:#fff;}
  .dotrow{display:flex;gap:7px;align-items:center;}
  .pdot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.22);cursor:pointer;transition:.18s;border:none;padding:0;}
  .pdot.on{background:var(--scarlet);transform:scale(1.35);}
  .counter{position:fixed;top:18px;right:22px;font-family:var(--mono);font-size:13px;color:rgba(255,255,255,.55);z-index:50;letter-spacing:.05em;}
  .fsbtn{position:fixed;top:16px;left:22px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#cdd6ea;
    border-radius:8px;cursor:pointer;font-size:12px;font-family:var(--mono);padding:7px 12px;z-index:50;transition:.18s;letter-spacing:.04em;}
  .fsbtn:hover{background:rgba(255,255,255,.16);color:#fff;}
  .progress{position:fixed;top:0;left:0;height:3px;background:var(--scarlet);z-index:60;transition:width .3s ease;}
  .hint{position:fixed;bottom:62px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.4);font-family:var(--mono);
    font-size:11px;letter-spacing:.08em;z-index:50;}
  @media (max-width:520px){.hint{display:none;}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;
const DATA = [{"type": "title", "kicker": "Rutgers SC&I · Data Science Concentration", "lines": ["Getting Started", "with Google", "Colab"], "subKick": "STUDENT GUIDE", "subText": "Your zero-install Python workspace", "metaTop": "Week 1 · Environment Setup", "metaBot": "Tawfiq Ammari · tawfiq.ammari@rutgers.edu", "code": ["# nothing to install", "# runs in your browser", "", "print(\"Hello, Colab!\")", "", "# Hello, Colab!", "", "# let's set it up →"]}, {"type": "bullets", "kicker": "Why Colab", "title": "What is Google Colab?", "bullets": ["A free Jupyter notebook that runs entirely in your web browser", "Nothing to install — your code runs on Google's servers, not your laptop", "Comes with Python, Pandas, and NumPy already set up", "Free access to GPUs/TPUs for heavier work later in the program", "Notebooks autosave to your Google Drive"], "tip": {"head": "All you need", "body": "A free Google account. If you have Gmail, you already have one."}}, {"type": "numbered", "kicker": "Step 1 · Open Colab", "title": "Open Colab and sign in", "steps": [["Go to the site", "Visit colab.research.google.com in any browser"], ["Sign in", "Use your Google account — 'Sign in', top-right"], ["You're in", "A welcome page opens with examples and recent notebooks"]], "side": {"type": "tip", "head": "The address", "body": "colab.research.google.com — bookmark it so it's one click next time."}}, {"type": "cards", "kicker": "Step 2 · A Notebook", "title": "Open or create a notebook", "cols": 3, "cards": [["New notebook", "File → New notebook", "Starts a fresh, blank notebook in your Drive"], ["Open notebook", "File → Open notebook", "Tabs: Recent · Drive · GitHub · Upload"], ["Upload", "Open notebook → Upload", "Bring an .ipynb from your computer"]]}, {"type": "numbered", "kicker": "Step 3 · Upload", "title": "Upload an existing notebook", "steps": [["Open the dialog", "File → Upload notebook (or Open notebook → Upload tab)"], ["Choose your file", "Drag your .ipynb in, or click Browse to find it"], ["It opens and saves", "Colab copies it to a 'Colab Notebooks' folder in your Drive"]], "side": {"type": "tip", "head": "Shortcut", "body": "You can drag an .ipynb file straight onto the Upload tab."}}, {"type": "cards", "kicker": "The Interface", "title": "Find your way around", "cols": 2, "cards": [["Code cells", "", "Where Python runs. Click + Code to add one."], ["Text cells", "", "Notes written in Markdown. Click + Text to add one."], ["Run a cell", "Shift + Enter", "Or click the play button to the left of the cell."], ["Left sidebar", "", "The folder icon opens your Files; above it, the contents."]]}, {"type": "bulletsCode", "kicker": "Try It", "title": "Run your first cell", "bullets": ["The first run connects you to a runtime — give it a few seconds", "Output appears directly under the cell", "Variables stay in memory for the next cell", "Re-run a cell anytime to refresh its output"], "code": ["# click an empty code cell,", "# then type:", "", "print(\"Hello, Colab!\")", "", "# press  Shift + Enter", "# output appears below:", "# Hello, Colab!"]}, {"type": "bullets", "kicker": "Don't Lose It", "title": "Saving your work", "bullets": ["Colab autosaves to a 'Colab Notebooks' folder in your Google Drive", "Save a checkpoint anytime: File → Save (Ctrl / Cmd + S)", "Get a local copy: File → Download → Download .ipynb", "Closing the tab is fine — your saved notebook stays safe in Drive"], "tip": {"head": "Runtime vs. notebook", "body": "Your code and notes are saved. The temporary machine that runs them can reset — that's normal."}}, {"type": "bullets", "kicker": "Good to Know", "title": "A few things to expect", "bullets": ["Idle sessions disconnect after a while — just reconnect and re-run", "Files you upload to /content are temporary and clear on reset", "Need more power? Runtime → Change runtime type to pick a GPU", "To keep data between sessions, use Google Drive — see the next guide"], "tip": {"head": "Next up", "body": "Accessing your files: from your laptop and from Google Drive."}}, {"type": "closing", "kicker": "You're Set Up", "title": "Ready to write code", "cards": [["OPEN", "colab.research.google.com", "Bookmark it"], ["UPLOAD", "File → Upload notebook", "Bring your .ipynb"], ["RUN", "Shift + Enter", "Output appears below"]], "next": "Next guide → Accessing Your Files in Colab", "footer": "Tawfiq Ammari · tawfiq.ammari@rutgers.edu · Rutgers SC&I Data Science Concentration"}];

function Code({lines,fs=15,style}){
  return (
    <div className="code" style={style}>
      <div className="dots"><i style={{background:'#FF5F56'}}/><i style={{background:'#FFBD2E'}}/><i style={{background:'#27C93F'}}/></div>
      <pre style={{fontSize:fs}}>{lines.map((ln,i)=>{
        const t=ln.replace(/^\s+/,'');
        if(t.startsWith('#')) return <span key={i} className="cm">{ln+'\n'}</span>;
        const idx=ln.indexOf('  #');
        if(idx>=0) return <span key={i}>{ln.slice(0,idx)}<span className="cm">{ln.slice(idx)}</span>{'\n'}</span>;
        return <span key={i}>{ln+'\n'}</span>;
      })}</pre>
    </div>
  );
}
const Kicker=({children})=><div className="kicker">{children}</div>;
const Title=({children})=><h2 className="s-title">{children}</h2>;
const Tip=({head,body})=>(<div className="tip"><div className="edge"/><h4>{head}</h4><p>{body}</p></div>);

const ICON={
  laptop:(<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"/><line x1="2" y1="20" x2="22" y2="20"/></svg>),
  drive:(<svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M8.5 3h7l5.5 9.5h-7z" fill="rgba(255,255,255,.12)"/><path d="M8.5 3l-5.5 9.5L6.5 18 12 8.5z"/><path d="M3 12.5L6.5 18h11l-3.5-5.5z"/></svg>),
  cloud:(<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d="M17.5 18a4 4 0 0 0 .5-7.97A6 6 0 0 0 6 9.5 4 4 0 0 0 6.5 18z"/><polyline points="9 14 12 11 15 14"/><line x1="12" y1="11" x2="12" y2="17"/></svg>),
};

/* ---------------- renderers ---------------- */
function TitleSlide(s){
  return (
    <div className="slide dark">
      <Kicker>{s.kicker}</Kicker>
      <h1 style={{fontFamily:'var(--head)',fontWeight:700,fontSize:58,lineHeight:1.04,color:'#fff',marginTop:30,letterSpacing:'-.015em'}}>
        {s.lines.map((l,i)=><div key={i}>{l}</div>)}
      </h1>
      <div style={{marginTop:30,fontSize:24}}>
        <span style={{color:'var(--scarlet)',fontWeight:700}}>{s.subKick}&nbsp;&nbsp;</span>
        <span style={{color:'#D7DEEC'}}>{s.subText}</span>
      </div>
      <div style={{marginTop:28,fontSize:16,lineHeight:1.55}}>
        <div style={{fontWeight:700,color:'#fff'}}>{s.metaTop}</div>
        <div style={{color:'var(--steel-lt)'}}>{s.metaBot}</div>
      </div>
      <Code style={{position:'absolute',right:70,top:150,width:360}} fs={15.5} lines={s.code}/>
    </div>
  );
}
function Bullets(s){
  return (
    <div className="slide">
      <Kicker>{s.kicker}</Kicker><Title>{s.title}</Title>
      <div style={{display:'grid',gridTemplateColumns:s.tip?'1.55fr 1fr':'1fr',gap:46,marginTop:40,alignItems:'start'}}>
        <ul className="blist">{s.bullets.map((b,i)=><li key={i}>{b}</li>)}</ul>
        {s.tip && <div style={{marginTop:6}}><Tip head={s.tip.head} body={s.tip.body}/></div>}
      </div>
    </div>
  );
}
function BulletsCode(s){
  const code=<Code lines={s.code} fs={14.5}/>;
  const list=<ul className="blist">{s.bullets.map((b,i)=><li key={i}>{b}</li>)}</ul>;
  return (
    <div className="slide">
      <Kicker>{s.kicker}</Kicker><Title>{s.title}</Title>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:40,marginTop:40,alignItems:'start'}}>
        {s.codeFirst?code:list}{s.codeFirst?list:code}
      </div>
    </div>
  );
}
function Numbered(s){
  const side=s.side&&(s.side.type==='code'
    ? <Code lines={s.side.code} fs={14}/>
    : <Tip head={s.side.head} body={s.side.body}/>);
  return (
    <div className="slide">
      <Kicker>{s.kicker}</Kicker><Title>{s.title}</Title>
      <div style={{display:'grid',gridTemplateColumns:s.side?'1.15fr 1fr':'1fr',gap:48,marginTop:42,alignItems:'start'}}>
        <div style={{display:'flex',flexDirection:'column',gap:24}}>
          {s.steps.map((st,i)=>(
            <div key={i} style={{display:'flex',gap:20,alignItems:'flex-start'}}>
              <div className="num-chip">{i+1}</div>
              <div style={{paddingTop:4}}>
                <div style={{fontFamily:'var(--head)',fontWeight:600,fontSize:20,color:'var(--ink-txt)'}}>{st[0]}</div>
                <div style={{fontSize:16,color:'var(--body)',marginTop:5,lineHeight:1.4}}>{st[1]}</div>
              </div>
            </div>
          ))}
        </div>
        {s.side && <div style={{marginTop:4}}>{side}</div>}
      </div>
    </div>
  );
}
function Cards(s){
  return (
    <div className="slide">
      <Kicker>{s.kicker}</Kicker><Title>{s.title}</Title>
      <div style={{display:'grid',gridTemplateColumns:`repeat(${s.cols},1fr)`,gap:18,marginTop:38}}>
        {s.cards.map((c,i)=>(
          <div key={i} className="card" style={{padding:'24px 24px',minHeight:s.cols>2?150:140}}>
            <div className="top"/>
            <div style={{fontFamily:'var(--head)',fontWeight:600,fontSize:20,color:'var(--ink-txt)'}}>{c[0]}</div>
            {c[1]&&<div style={{fontFamily:'var(--mono)',fontWeight:700,fontSize:14,color:'var(--scarlet)',marginTop:10}}>{c[1]}</div>}
            {c[2]&&<div style={{fontSize:15,color:'var(--body)',marginTop:c[1]?8:12,lineHeight:1.4}}>{c[2]}</div>}
          </div>
        ))}
      </div>
    </div>
  );
}
function Callout(s){
  return (
    <div className="slide">
      <Kicker>{s.kicker}</Kicker><Title>{s.title}</Title>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:30,marginTop:40}}>
        {s.boxes.map((b,i)=>(
          <div key={i} style={{position:'relative',overflow:'hidden',borderRadius:14,padding:'34px 36px',minHeight:240,
            background:b.dark?'var(--ink)':'var(--cloud)',
            border:b.dark?'none':'1px solid var(--card-bd)',
            boxShadow:'0 14px 34px rgba(20,30,55,.16)'}}>
            {!b.dark&&<div style={{position:'absolute',left:0,top:0,bottom:0,width:8,background:'var(--scarlet)'}}/>}
            <div style={{fontFamily:b.dark?'var(--mono)':'var(--head)',fontWeight:700,fontSize:26,
              color:b.dark?'#fff':'var(--ink-txt)'}}>{b.head}</div>
            <div style={{fontSize:14,fontWeight:700,letterSpacing:'.14em',marginTop:12,
              color:b.dark?'var(--steel-lt)':'var(--scarlet)'}}>{b.sub}</div>
            <div style={{fontSize:16,marginTop:16,lineHeight:1.5,color:b.dark?'#D7DEEC':'var(--body)'}}>{b.body}</div>
          </div>
        ))}
      </div>
      {s.note&&<div className="footnote" style={{marginTop:28}}>{s.note}</div>}
    </div>
  );
}
function Compare(s){
  return (
    <div className="slide">
      <Kicker>{s.kicker}</Kicker><Title>{s.title}</Title>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:30,marginTop:38}}>
        {s.cols.map((col,i)=>(
          <div key={i} className="card" style={{padding:0}}>
            <div style={{background:'var(--ink)',color:'#fff',padding:'16px 26px',
              fontFamily:'var(--head)',fontWeight:700,fontSize:20}}>{col.head}</div>
            <div style={{padding:'18px 26px 22px'}}>
              {col.rows.map((r,j)=>(
                <div key={j} style={{display:'flex',gap:18,padding:'11px 0',
                  borderBottom:j<col.rows.length-1?'1px solid var(--card-bd)':'none'}}>
                  <div style={{flex:'0 0 130px',fontFamily:'var(--mono)',fontSize:11.5,fontWeight:700,
                    color:'var(--scarlet)',letterSpacing:'.08em',textTransform:'uppercase',paddingTop:2}}>{r[0]}</div>
                  <div style={{fontSize:15.5,color:'var(--ink-txt)'}}>{r[1]}</div>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
      {s.note&&<div className="footnote" style={{marginTop:24}}>{s.note}</div>}
    </div>
  );
}
function Divider(s){
  return (
    <div className="slide dark divider">
      <div style={{position:'absolute',top:200,left:70}}>
        <div className="mod-label">Option</div>
        <div style={{display:'flex',alignItems:'flex-start',gap:36,marginTop:10}}>
          <div className="big-num">{s.num}</div>
          <div style={{marginTop:40}}>
            <div className="d-title">{s.title}</div>
            <div className="d-sub">{s.sub}</div>
          </div>
        </div>
      </div>
      <div className="ic-ring" style={{position:'absolute',right:90,top:300}}>{ICON[s.icon]}</div>
    </div>
  );
}
function Closing(s){
  return (
    <div className="slide dark">
      <Kicker>{s.kicker}</Kicker>
      <h2 style={{fontFamily:'var(--head)',fontWeight:700,fontSize:42,color:'#fff',marginTop:14}}>{s.title}</h2>
      <div style={{display:'grid',gridTemplateColumns:`repeat(${s.cards.length},1fr)`,gap:22,marginTop:44}}>
        {s.cards.map((c,i)=>(
          <div key={i} style={{background:'var(--ink2)',border:'1px solid #33406A',borderRadius:13,
            padding:'26px 22px',position:'relative',overflow:'hidden',minHeight:200}}>
            <div className="top"/>
            <div style={{fontFamily:'var(--head)',fontWeight:700,fontSize:24,color:'var(--scarlet)',marginTop:6}}>{c[0]}</div>
            <div style={{fontFamily:'var(--mono)',fontSize:14,fontWeight:700,color:'#fff',marginTop:14,lineHeight:1.3,wordBreak:'break-word'}}>{c[1]}</div>
            <div style={{fontSize:14,color:'var(--steel-lt)',marginTop:12}}>{c[2]}</div>
          </div>
        ))}
      </div>
      <div style={{marginTop:38,fontSize:20}}>
        <span style={{color:'var(--scarlet)',fontWeight:700}}>{s.next.split('→')[0]}→ </span>
        <span style={{color:'#D7DEEC'}}>{s.next.split('→')[1].trim()}</span>
      </div>
      <div style={{position:'absolute',left:70,bottom:50,fontFamily:'var(--mono)',fontSize:13,color:'var(--steel)'}}>{s.footer}</div>
    </div>
  );
}
const RENDER={title:TitleSlide,bullets:Bullets,bulletsCode:BulletsCode,numbered:Numbered,
  cards:Cards,callout:Callout,compare:Compare,divider:Divider,closing:Closing};

function Deck(){
  const [i,setI]=useState(0);
  const [scale,setScale]=useState(1);
  const iRef=useRef(0);
  const go=useCallback(n=>setI(p=>{const v=Math.max(0,Math.min(DATA.length-1,n));iRef.current=v;return v;}),[]);
  useEffect(()=>{iRef.current=i;},[i]);
  useEffect(()=>{
    const onKey=e=>{
      if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(iRef.current+1);}
      else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(iRef.current-1);}
      else if(e.key==='Home')go(0); else if(e.key==='End')go(DATA.length-1);
      else if(e.key==='f'||e.key==='F')toggleFs();
    };
    window.addEventListener('keydown',onKey);return()=>window.removeEventListener('keydown',onKey);
  },[go]);
  useEffect(()=>{
    const fit=()=>{const sw=(window.innerWidth-64)/1280,sh=(window.innerHeight-104)/720;setScale(Math.min(sw,sh,1.25));};
    fit();window.addEventListener('resize',fit);return()=>window.removeEventListener('resize',fit);
  },[]);
  const toggleFs=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();};
  const Cur=RENDER[DATA[i].type];
  return (
    <div className="deck">
      <div className="progress" style={{width:((i+1)/DATA.length*100)+'%'}}/>
      <button className="fsbtn" onClick={toggleFs}>⛶ Fullscreen (F)</button>
      <div className="counter">{String(i+1).padStart(2,'0')} / {String(DATA.length).padStart(2,'0')}</div>
      <div style={{transform:`scale(${scale})`}}>
        <div className="stage">{Cur(DATA[i])}</div>
      </div>
      <div className="hint">← →  navigate   ·   F  fullscreen</div>
      <div className="chrome">
        <button className="nav-btn" onClick={()=>go(i-1)}>‹</button>
        <div className="dotrow">{DATA.map((_,k)=><button key={k} className={"pdot"+(k===i?' on':'')} onClick={()=>go(k)}/>)}</div>
        <button className="nav-btn" onClick={()=>go(i+1)}>›</button>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Deck/>);
</script>
</body>
</html>
