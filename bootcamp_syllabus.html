<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MI Program Summer 2026: Introductory Python &amp; Mathematics Bootcamp</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

<style>

  :root {
    --slate: #5C6FA0;
    --slate-mid: #6D80B0;
    --slate-light: #8898C2;
    --peach: #E8956A;
    --peach-light: #F0AA85;
    --peach-pale: #FEF4EE;
    --bg: #F6F4FB;
    --sage: #6BA890;
    --sage-pale: #EDF6F2;
    --lavender-pale: #EEEAFC;
    --text: #2D3748;
    --text-mid: #4A5568;
    --text-muted: #718096;
    --border: #DDD7EE;
    --border-dark: #C8BEE0;
    --white: #ffffff;
    --scarlet: #cc0033;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    font-size: 16px;

  #root { min-height: 100vh; }

  /* ── Header ── */
  .site-header {
    background: var(--slate);
    color: white;
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 3px solid var(--peach);
  }
  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
  }
  .header-brand {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    color: var(--peach-light);
    letter-spacing: 0.01em;
  }
  .header-nav { display: flex; gap: 0.25rem; align-items: center; }
  .nav-btn {
    background: none;
    border: none;
    color: rgba(255,255,255,0.75);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    padding: 0.35rem 0.75rem;
    border-radius: 4px;
    cursor: pointer;
    transition: color 0.2s, background 0.2s;
    letter-spacing: 0.02em;
  }
  .nav-btn:hover { color: white; background: rgba(255,255,255,0.12); }
  .nav-btn.active { color: var(--peach-light); }
  .nav-divider { width: 1px; height: 22px; background: rgba(255,255,255,0.2); margin: 0 0.4rem; }
  .page-tab {
    display: inline-block;
    background: none;
    border: 1.5px solid rgba(255,255,255,0.3);
    color: rgba(255,255,255,0.8);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    padding: 0.28rem 0.85rem;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.01em;
    line-height: 1.5;
    vertical-align: middle;
    box-sizing: border-box;
  }
  .page-tab:hover { color: white; border-color: rgba(255,255,255,0.55); }
  .page-tab.active { color: var(--slate); background: white; border-color: white; font-weight: 500; }

  /* ── Hero ── */
  .hero {
    background: linear-gradient(140deg, var(--slate) 0%, var(--slate-mid) 55%, #8898C8 100%);
    color: white;
    padding: 4.5rem 2rem 3.5rem;
  }
  .hero-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2rem;
    align-items: end;
  }
  .hero-institution {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    color: var(--peach-light);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }
  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.75rem, 3.5vw, 2.85rem);
    font-weight: 700;
    line-height: 1.2;
    color: white;
    margin-bottom: 0.75rem;
  }
  .hero-subtitle {
    font-size: 1rem;
    color: rgba(255,255,255,0.85);
    font-weight: 300;
    max-width: 560px;
    line-height: 1.65;
  }
  .hero-meta { text-align: right; min-width: 200px; }
  .hero-badge {
    display: inline-block;
    background: var(--peach);
    color: white;
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    font-weight: 500;
    padding: 0.3rem 0.9rem;
    border-radius: 20px;
    letter-spacing: 0.06em;
    margin-bottom: 1rem;
  }
  .hero-date {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: rgba(255,255,255,0.92);
    line-height: 1.4;
  }
  .hero-instructor { font-size: 0.82rem; color: rgba(255,255,255,0.6); margin-top: 0.5rem; }
  .hero-instructor a { color: var(--peach-light); text-decoration: none; }

  /* ── Welcome banner ── */
  .welcome-banner {
    background: linear-gradient(135deg, var(--lavender-pale) 0%, var(--peach-pale) 100%);
    border-bottom: 1px solid var(--border);
    padding: 1.1rem 2rem;
  }
  .welcome-banner-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 0.9rem;
  }
  .welcome-emoji { font-size: 1.35rem; flex-shrink: 0; }
  .welcome-text { font-size: 0.88rem; color: var(--text-mid); line-height: 1.55; }
  .welcome-text strong { color: var(--slate); }

  /* ── Info strip ── */
  .info-strip { background: var(--slate-mid); }
  .info-strip-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 1.25rem 2rem;
    display: flex;
    gap: 2.5rem;
    flex-wrap: wrap;
  }
  .info-item { display: flex; flex-direction: column; gap: 0.2rem; }
  .info-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    color: var(--peach-light);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .info-value { font-size: 0.87rem; color: rgba(255,255,255,0.88); }

  /* ── Main layout ── */
  .page-body {
    max-width: 860px;
    margin: 0 auto;
    padding: 3rem 2rem;
  }

  /* ── Content ── */
  .content { min-width: 0; }
  .section { margin-bottom: 3.5rem; scroll-margin-top: 80px; }
  .section-header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 1.5rem;
    padding-bottom: 0.75rem;
    border-bottom: 2px solid var(--border);
  }
  .section-number {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: var(--peach);
    letter-spacing: 0.06em;
  }
  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--slate);
  }
  .section p { color: var(--text-mid); margin-bottom: 1rem; line-height: 1.8; }
  .section p:last-child { margin-bottom: 0; }

  /* ── Overview table ── */
  .overview-table { width: 100%; border-collapse: collapse; font-size: 0.87rem; margin: 1rem 0; }
  .overview-table th {
    background: var(--slate);
    color: var(--peach-light);
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.75rem 1rem;
    text-align: left;
    border: none;
  }
  .overview-table td {
    padding: 0.9rem 1rem;
    border-bottom: 1px solid var(--border);
    color: var(--text-mid);
    vertical-align: top;
  }
  .overview-table tr:last-child td { border-bottom: none; }
  .overview-table tr:nth-child(even) td { background: rgba(91,111,160,0.03); }
  .overview-table tr:hover td { background: var(--peach-pale); }
  .week-num { font-family: 'DM Mono', monospace; font-size: 0.78rem; color: var(--peach); font-weight: 500; white-space: nowrap; }
  .capstone-row td { background: var(--peach-pale) !important; }
  .capstone-label { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--peach); letter-spacing: 0.04em; }

  /* ── Learning objectives ── */
  .objectives-list { list-style: none; display: grid; gap: 0.6rem; }
  .objective-item {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    background: white;
    border: 1px solid var(--border);
    border-left: 3px solid var(--sage);
    border-radius: 0 6px 6px 0;
    font-size: 0.88rem;
    color: var(--text-mid);
    line-height: 1.6;
  }
  .obj-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--sage); flex-shrink: 0; margin-top: 0.45rem; }

  /* ── Assessment ── */
  .assessment-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.5rem;
    margin-bottom: 1.25rem;
  }
  .assessment-title {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    font-weight: 600;
    color: var(--slate);
    margin-bottom: 0.5rem;
  }
  .assessment-desc { font-size: 0.87rem; color: var(--text-muted); line-height: 1.65; }

  /* ── Milestone box ── */
  .milestone-box {
    background: var(--peach-pale);
    border: 1px solid #F0C4A8;
    border-left: 4px solid var(--peach);
    border-radius: 0 6px 6px 0;
    padding: 1.25rem 1.5rem;
    margin: 1.5rem 1.75rem;
  }
  .milestone-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--peach);
    margin-bottom: 0.5rem;
  }
  .milestone-text { font-size: 0.87rem; color: var(--text-mid); line-height: 1.65; }

  /* ── Week sections ── */
  .week-section { scroll-margin-top: 80px; margin-bottom: 3rem; }
  .week-header {
    background: linear-gradient(135deg, var(--slate) 0%, var(--slate-mid) 100%);
    color: white;
    padding: 1.5rem 1.75rem;
    border-radius: 8px 8px 0 0;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .week-badge { font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--peach-light); letter-spacing: 0.08em; text-transform: uppercase; }
  .week-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; flex: 1; }
  .week-date { font-family: 'DM Mono', monospace; font-size: 0.78rem; color: rgba(255,255,255,0.55); }
  .week-body {
    background: white;
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 8px 8px;
    overflow: hidden;
  }
  .week-subsection { padding: 1.5rem 1.75rem; border-bottom: 1px solid var(--border); }
  .week-subsection:last-child { border-bottom: none; }
  .week-sub-title {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--slate);
    margin-bottom: 1rem;
  }
  .session-list { list-style: none; display: flex; flex-direction: column; gap: 0.4rem; }
  .session-item { display: flex; gap: 0.75rem; font-size: 0.87rem; color: var(--text-mid); line-height: 1.5; align-items: flex-start; }
  .session-dash { color: var(--peach); font-family: 'DM Mono', monospace; flex-shrink: 0; margin-top: 0.1rem; }

  /* ── Sessions page header ── */
  .sessions-page-header {
    background: linear-gradient(135deg, var(--lavender-pale) 0%, var(--peach-pale) 100%);
    border-bottom: 1px solid var(--border);
    padding: 2.25rem 2rem 2rem;

  .sessions-page-header-inner { max-width: 1100px; margin: 0 auto; }
  .sessions-page-title { font-family: 'Playfair Display', serif; font-size: 1.75rem; color: var(--slate); margin-bottom: 0.5rem; }
  .sessions-page-desc { font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; max-width: 580px; }

  /* ── FAQ page ── */
  .faq-page-header {
    background: linear-gradient(135deg, var(--sage-pale) 0%, var(--lavender-pale) 100%);
    border-bottom: 1px solid var(--border);
    padding: 2.25rem 2rem 2rem;
  }
  .faq-page-header-inner { max-width: 1100px; margin: 0 auto; }
  .faq-page-title { font-family: 'Playfair Display', serif; font-size: 1.75rem; color: var(--slate); margin-bottom: 0.5rem; }
  .faq-page-desc { font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; max-width: 580px; }

  .faq-category {
    margin-bottom: 2.75rem;
  }
  .faq-category-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--peach);
    margin-bottom: 1rem;
    padding-bottom: 0.6rem;
    border-bottom: 2px solid var(--border);
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .faq-category-label::before {
    content: '';
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--peach);
    flex-shrink: 0;
  }

  .faq-item {
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 0.75rem;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .faq-item:hover { box-shadow: 0 2px 12px rgba(92,111,160,0.1); }

  .faq-question {
    width: 100%;
    background: none;
    border: none;
    padding: 1.1rem 1.4rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    cursor: pointer;
    text-align: left;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--slate);
    line-height: 1.5;
    transition: background 0.15s;
  }
  .faq-question:hover { background: var(--lavender-pale); }
  .faq-question.open { background: var(--lavender-pale); border-bottom: 1px solid var(--border); }

  .faq-chevron {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    color: var(--peach);
    transition: transform 0.2s;
  }
  .faq-chevron.open { transform: rotate(180deg); }

  .faq-answer {
    padding: 1.1rem 1.4rem;
    font-size: 0.87rem;
    color: var(--text-mid);
    line-height: 1.8;
    border-top: 1px solid var(--border);
    background: white;
  }
  .faq-answer p { margin-bottom: 0.75rem; }
  .faq-answer p:last-child { margin-bottom: 0; }
  .faq-answer ul {
    margin: 0.5rem 0 0.75rem 0;
    padding-left: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  .faq-answer ul li {
    display: flex;
    gap: 0.6rem;
    align-items: flex-start;
    font-size: 0.87rem;
    color: var(--text-mid);
  }
  .faq-answer ul li::before {
    content: '→';
    color: var(--peach);
    font-family: 'DM Mono', monospace;
    flex-shrink: 0;
    font-size: 0.78rem;
    margin-top: 0.22rem;
  }
  .faq-answer strong { color: var(--slate); font-weight: 600; }
  .faq-answer .faq-note {
    background: var(--peach-pale);
    border-left: 3px solid var(--peach);
    border-radius: 0 4px 4px 0;
    padding: 0.75rem 1rem;
    font-size: 0.83rem;
    margin-top: 0.75rem;
    color: var(--text-mid);
  }
  .faq-tools-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 0.5rem;
    margin-top: 0.75rem;
  }
  .faq-tool-chip {
    background: var(--lavender-pale);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.5rem 0.75rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    color: var(--slate);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  /* ── Footer ── */
  .page-footer {
    background: var(--slate);
    color: rgba(255,255,255,0.45);
    text-align: center;
    padding: 2rem;
    font-size: 0.78rem;
    margin-top: 3rem;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.04em;
  }
  .page-footer a { color: var(--peach-light); text-decoration: none; }

  @media (max-width: 760px) {
    .page-body { grid-template-columns: 1fr; }
    .hero-inner { grid-template-columns: 1fr; }
    .hero-meta { text-align: left; }
    .info-strip-inner { gap: 1.25rem; }
    .header-nav { display: none; }
  }
</style>
</head>

function scrollTo(id) {
  document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
}

function NavBtn({ label, sectionId }) {
  return (
    <button className="nav-btn" onClick={() => scrollTo(sectionId)}>
      {label}
    </button>
  );
}

function WeekSection({ w }) {
  return (
    <div className="week-section" id={w.id}>
      <div className="week-header" style={w.capstone ? { background: "linear-gradient(135deg, #8B6BAE 0%, #A07FC0 100%)" } : {}}>
        <div>
          <div className="week-badge">Week {w.num}</div>
          <div className="week-title">{w.title}</div>
        </div>
        <div className="week-date">{w.date}</div>

      <div className="week-body">
        <div className="week-subsection">
          <p style={{ fontSize: "0.88rem", color: "#4b5563", lineHeight: "1.75" }}>{w.description}</p>

        <div className="week-subsection">
          <div className="week-sub-title">Synchronous Session (3 hours)</div>
          <ul className="session-list">
            {w.session.map((item, i) => (
              <li key={i} className="session-item">
                <span className="session-dash">→</span>
                <span>{item}</span>
              </li>
            ))}
          </ul>
        </div>
        <div className="week-subsection">
          <div className="week-sub-title">Asynchronous Work</div>
          <ul className="session-list">
            {w.async.map((item, i) => (
              <li key={i} className="session-item">
                <span className="session-dash">→</span>
                <span>{item}</span>
              </li>
            ))}

        <div className="milestone-box">
          <div className="milestone-label">{w.capstone ? "★ Final Milestone: Capstone Project" : `Week ${w.num} Milestone`}</div>
          <div className="milestone-text">{w.milestone}</div>
        </div>
      </div>
    </div>
  );
}

function FaqItem({ q, a }) {
  const [open, setOpen] = useState(false);
  return (
    <div className="faq-item">
      <button className={`faq-question ${open ? 'open' : ''}`} onClick={() => setOpen(!open)}>
        <span>{q}</span>
        <svg className={`faq-chevron ${open ? 'open' : ''}`} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
      {open && (
        <div className="faq-answer">{a}</div>
      )}
    </div>
  );
}
